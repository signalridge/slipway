<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="run-states-title run-states-desc">
  <title id="run-states-title">Slipway Run states and recovery</title>
  <desc id="run-states-desc">A Run is created only by an explicit user start and becomes active. An active Run pauses for one of four reported reasons: a human decision, an unavailable environment dependency, an exhausted Action budget, or confirmation of an exact destructive scope. A changed or unavailable issue source pauses as a decision or creates a paused source candidate awaiting an explicit choice. Answering, confirming, or skipping can produce an Active next Action or leave the Run Paused on budget exhaustion. Stop invalidates pending work but keeps the journal and can move a paused Run to Stopped. Resume is authorized only after stop or when the current typed next.operation is a resume variant; it may produce Active or Paused depending on the resulting typed state. Ended is terminal and cannot be resumed. Every resume revalidates the original worktree identity and voids stale work.</desc>
  <metadata id="mermaid-source"><![CDATA[
stateDiagram-v2
  [*] --> Active: explicit user start (slipway run)
  Active --> Paused: needs_input or CLI budget_exhausted
  Paused --> Active: answer / confirm / skip → next.operation = action
  Paused --> Paused: answer / confirm / skip → budget_exhausted
  Paused --> Paused: resume source refresh → paused source candidate
  Paused --> Stopped: stop
  Active --> Stopped: slipway stop · reorder · take over
  Stopped --> Active: current typed resume variant → next.operation = action
  Stopped --> Paused: current typed resume variant → source candidate / paused typed state
  Active --> Ended: automatic Action queue empty
  Ended --> [*]

  note right of Paused
    four reported reasons
    decision_required (includes changed or unavailable issue source)
    environment_unavailable
    budget_exhausted (CLI-only)
    destructive_confirmation_required
    answerable decision/destructive pauses use answer or skip, not resume
    only current typed next.operation = resume authorizes resume
  end note

  note right of Stopped
    pending work invalidated
    journal retained and resumable
    resume may result in Active or Paused
  end note

  note right of Ended
    terminal · not resumable
    not a certificate for tests, review, merge, or release
  end note
]]></metadata>
  <defs>
    <style>
      :root {
        --text: #0f172a;
        --muted: #64748b;
        --line: #94a3b8;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --band: #f8fafc;
        --band-border: #e2e8f0;
        --entry-fill: #fff6e6;
        --entry-stroke: #d98a13;
        --action-fill: #fff0ea;
        --action-stroke: #f2643b;
        --host-fill: #f1f5f9;
        --host-stroke: #475569;
        --verify-fill: #e7faf6;
        --verify-stroke: #0e8077;
        --pause-fill: #f3efff;
        --pause-stroke: #7c5ce0;
        --stop-fill: #fff0f4;
        --stop-stroke: #c81e63;
        --term-fill: #0f172a;
        --term-text: #ffffff;
        --label-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf3;
          --muted: #8b949e;
          --line: #64748b;
          --card: #161b22;
          --card-border: #30363d;
          --band: #0d1117;
          --band-border: #30363d;
          --entry-fill: #3a2606;
          --entry-stroke: #fbbf24;
          --action-fill: #3a1a10;
          --action-stroke: #ff8a5c;
          --host-fill: #1e293b;
          --host-stroke: #94a3b8;
          --verify-fill: #04302b;
          --verify-stroke: #4fd6c6;
          --pause-fill: #241b42;
          --pause-stroke: #a78bfa;
          --stop-fill: #330a1b;
          --stop-stroke: #ff5e9a;
          --term-fill: #e6edf3;
          --term-text: #0d1117;
          --label-bg: #0d1117;
        }
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title-big { fill: var(--text); font-size: 19px; font-weight: 700; }
      .title { fill: var(--text); font-size: 14px; font-weight: 650; }
      .state-name { fill: var(--text); font-size: 16px; font-weight: 700; }
      .sub { fill: var(--muted); font-size: 11px; }
      .tiny { fill: var(--muted); font-size: 9.5px; }
      .tag { fill: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; }
      .mono { fill: var(--text); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      .mono-tiny { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; }
      .band { fill: var(--band); stroke: var(--band-border); stroke-width: 1.5; }
      .card { fill: var(--card); stroke: var(--card-border); stroke-width: 1.6; }
      .entry { fill: var(--entry-fill); stroke: var(--entry-stroke); stroke-width: 1.8; }
      .active { fill: var(--verify-fill); stroke: var(--verify-stroke); stroke-width: 2.2; }
      .pause { fill: var(--pause-fill); stroke: var(--pause-stroke); stroke-width: 2; }
      .stop { fill: var(--stop-fill); stroke: var(--stop-stroke); stroke-width: 2; }
      .flow { fill: none; stroke: var(--line); stroke-width: 2; }
      .flow-main { fill: none; stroke: var(--verify-stroke); stroke-width: 2.2; }
      .flow-pause { fill: none; stroke: var(--pause-stroke); stroke-width: 1.9; }
      .flow-stop { fill: none; stroke: var(--stop-stroke); stroke-width: 1.9; }
      .edge-label { fill: var(--muted); font-size: 9px; font-style: italic; }
      .label-bg { fill: var(--label-bg); opacity: 0.98; }
      .flow,
      .flow-main,
      .flow-pause,
      .flow-stop {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .term-text { fill: var(--term-text); font-size: 16px; font-weight: 700; }
      .note { fill: var(--band); stroke: var(--band-border); stroke-width: 1.2; }
    </style>
    <marker id="rs-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="rs-arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--verify-stroke)"/>
    </marker>
    <marker id="rs-arrow-pause" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pause-stroke)"/>
    </marker>
    <marker id="rs-arrow-stop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--stop-stroke)"/>
    </marker>
  </defs>

  <text class="title-big" x="40" y="36">Slipway · Run states and recovery</text>
  <text class="sub" x="40" y="58">explicit start · typed `next` controls recovery · stop keeps the journal · ended is terminal</text>

  <!-- connectors use dedicated outer rails; nodes are painted afterwards -->
  <line class="flow" x1="91" y1="195" x2="150" y2="195" marker-end="url(#rs-arrow)"/>
  <path class="flow-pause" d="M420 205 H620" marker-end="url(#rs-arrow-pause)"/>
  <path class="flow-main" d="M620 255 H500 V235 H420" marker-end="url(#rs-arrow-main)"/>
  <path class="flow-stop" d="M250 275 V390 H310 V430" marker-end="url(#rs-arrow-stop)"/>
  <path class="flow-stop" d="M700 315 H1040 V405 H430 V430" marker-end="url(#rs-arrow-stop)"/>
  <path class="flow-pause" d="M470 475 H520 V350 H900 V315" marker-end="url(#rs-arrow-pause)"/>
  <path class="flow-main" d="M350 135 V80 H1100 V430 H910" marker-end="url(#rs-arrow-main)"/>
  <path class="flow-main" d="M150 475 H30 V110 H285 V135" marker-end="url(#rs-arrow-main)"/>
  <path class="flow-pause" d="M940 170 H1150 V260 H940" marker-end="url(#rs-arrow-pause)"/>

  <!-- explicit start -->
  <circle cx="65" cy="195" r="26" fill="var(--entry-fill)" stroke="var(--entry-stroke)" stroke-width="1.8"/>
  <circle cx="65" cy="195" r="7" fill="var(--entry-stroke)"/>
  <text class="sub" x="65" y="242" text-anchor="middle">explicit start</text>
  <text class="mono-tiny" x="65" y="258" text-anchor="middle">slipway run</text>

  <!-- states -->
  <rect class="active" x="150" y="135" width="270" height="140" rx="18"/>
  <text class="state-name" x="285" y="171" text-anchor="middle">Active</text>
  <text class="sub" x="285" y="195" text-anchor="middle">one Action outstanding</text>
  <text class="sub" x="285" y="214" text-anchor="middle">budget decrements per Action</text>
  <text class="tiny" x="285" y="240" text-anchor="middle">host performs work, submits Outcome</text>
  <text class="tiny" x="285" y="258" text-anchor="middle">resume revalidates worktree identity</text>

  <rect class="pause" x="620" y="115" width="320" height="200" rx="18"/>
  <text class="state-name" x="780" y="151" text-anchor="middle">Paused</text>
  <text class="tag" x="780" y="171" text-anchor="middle">FOUR REPORTED REASONS</text>
  <text class="mono-tiny" x="780" y="193" text-anchor="middle">decision_required</text>
  <text class="mono-tiny" x="780" y="210" text-anchor="middle">environment_unavailable</text>
  <text class="mono-tiny" x="780" y="227" text-anchor="middle">destructive_confirmation_required</text>
  <text class="mono-tiny" x="780" y="244" text-anchor="middle">budget_exhausted · CLI-only</text>
  <text class="tiny" x="780" y="270" text-anchor="middle">answer/confirm/skip may remain Paused</text>
  <text class="tiny" x="780" y="288" text-anchor="middle">source refresh → paused candidate choice</text>
  <text class="tiny" x="780" y="306" text-anchor="middle">answerable pauses use answer or skip, not resume</text>

  <rect class="stop" x="150" y="430" width="320" height="90" rx="18"/>
  <text class="state-name" x="310" y="464" text-anchor="middle">Stopped</text>
  <text class="sub" x="310" y="486" text-anchor="middle">pending work invalidated · journal kept</text>
  <text class="tiny" x="310" y="504" text-anchor="middle">stop · reorder · manual takeover</text>

  <rect x="760" y="430" width="300" height="90" rx="18" fill="var(--term-fill)" stroke="var(--term-fill)" stroke-width="2"/>
  <text class="term-text" x="910" y="464" text-anchor="middle">Ended</text>
  <text x="910" y="486" fill="var(--term-text)" opacity="0.78" font-size="11" text-anchor="middle">automatic Action queue empty</text>
  <text x="910" y="504" fill="var(--term-text)" opacity="0.78" font-size="10" text-anchor="middle">terminal · resume is rejected</text>

  <!-- labels sit beside rails, never on top of a connector -->
  <rect class="label-bg" x="438" y="183" width="170" height="18" rx="5"/>
  <text class="edge-label" x="444" y="196">needs_input / budget exhausted</text>

  <rect class="label-bg" x="438" y="217" width="230" height="18" rx="5"/>
  <text class="edge-label" x="444" y="230">answer / confirm / skip → Active</text>

  <rect class="label-bg" x="948" y="212" width="170" height="18" rx="5"/>
  <text class="edge-label" x="954" y="225">result may stay Paused</text>

  <rect class="label-bg" x="155" y="366" width="180" height="18" rx="5"/>
  <text class="edge-label" x="161" y="379">stop · reorder · take over</text>

  <rect class="label-bg" x="665" y="314" width="220" height="18" rx="5"/>
  <text class="edge-label" x="671" y="327">resume source refresh → Paused candidate</text>

  <rect class="label-bg" x="110" y="316" width="210" height="18" rx="5"/>
  <text class="edge-label" x="116" y="329">typed resume → Active</text>

  <rect class="label-bg" x="760" y="62" width="200" height="18" rx="5"/>
  <text class="edge-label" x="766" y="75">automatic queue empty</text>

  <!-- invariants -->
  <rect class="band" x="40" y="570" width="546" height="140" rx="14"/>
  <text class="tag" x="60" y="594">EVERY AUTHORIZED RESUME REVALIDATES</text>
  <text class="sub" x="60" y="618">· only stop or current typed `next.operation = resume` authorizes protocol resume</text>
  <text class="sub" x="60" y="638">· root, per-worktree Git dir, and Git common dir must still match</text>
  <text class="sub" x="60" y="658">· stale Action IDs, answers, source candidates, and grants are voided</text>
  <text class="sub" x="60" y="678">· the resulting typed state may be Active or Paused</text>
  <text class="sub" x="60" y="698">· omitted --budget preserves positive remainder; zero replenishes</text>

  <rect class="band" x="614" y="570" width="546" height="140" rx="14"/>
  <text class="tag" x="634" y="594">ENDED IS NOT A CERTIFICATE</text>
  <text class="sub" x="634" y="618">It means only that Slipway has no more automatic Actions to issue.</text>
  <text class="sub" x="634" y="638">Tests passing, review findings, branch protection, pull-request approval,</text>
  <text class="sub" x="634" y="658">and release readiness remain separate facts that Slipway reports</text>
  <text class="sub" x="634" y="678">rather than decides.</text>
</svg>
