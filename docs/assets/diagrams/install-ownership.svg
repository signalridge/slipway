<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" role="img" aria-labelledby="install-ownership-title install-ownership-desc">
  <title id="install-ownership-title">Slipway adapter install and ownership safety</title>
  <desc id="install-ownership-desc">Install writes host-local capability files and records their repository-relative paths and SHA-256 hashes in a per-host ownership manifest. The manifest is the only file that authorizes later managed-file changes; the generated sentinel reports installation health, not ownership. On refresh or uninstall Slipway reclassifies each recorded file as pristine, missing, an ordinary user-modified file, or a stale generated claim. An ordinary user-modified file has current bytes that differ from its recorded claim and are not generated by this version; it is preserved and reported without being overwritten or removed. A stale generated claim is a recorded hash that does not match bytes generated by the current version; the preserved file is not overwritten or removed, the stale claim is withdrawn, and manual removal is required before regeneration. Only pristine files are mutated: refresh rewrites them and recreates missing ones, and uninstall removes them. Unknown files, a modified sentinel, a malformed manifest, a path escape, a duplicate claim, or an unsafe symlink are preserved or rejected with a reported reason, never silently adopted. Install and remove are transactional, and unsupported manifest versions fail before any mutation.
  </desc>
  <metadata id="mermaid-source"><![CDATA[
flowchart TB
  Install["slipway install --tool ID [--surface ide|cli]"] --> Write["write host-local capability files only\nno global host settings · no ambient hooks · no launcher"]
  Write --> Manifest["record ownership manifest\nrepository-relative paths + SHA-256 per file"]
  Manifest --> Note1["a new install claims ONLY the files it creates"]

  Later["slipway install --refresh   |   slipway uninstall"] --> Version{"manifest version supported?"}
  Version -->|no| FailFast["fail before any mutation"]
  Version -->|yes| Classify{"compare each recorded file's\ncurrent hash to its recorded hash"}

  Classify -->|pristine · hash matches| Mutate["refresh: rewrite · uninstall: remove"]
  Classify -->|missing| Recreate["refresh: recreate · uninstall: nothing to remove"]
  Classify -->|ordinary user-modified · current hash differs and is not current-version generated| Preserve["PRESERVE and report\nnever overwrite or remove"]
  Classify -->|stale generated claim · recorded hash does not match current-version bytes| Stale["PRESERVE file · withdraw stale claim\nmanual removal required before regeneration"]

  Unknown["unknown file · modified sentinel · malformed manifest\npath escape · duplicate claim · unsafe symlink"] --> Reject["never silently adopted as managed content\npreserve or reject, and report the reason"]

  Sentinel["generated sentinel = installation HEALTH"] -. "not ownership authority" .-> Manifest
  Stale --> Manual["preserved file stays in place\nremove it manually before refresh can regenerate"]
  Mutate --> Runs["Run data under the Git common directory is never touched"]
]]></metadata>
  <defs>
    <style>
      :root {
        --text: #0f172a;
        --muted: #64748b;
        --line: #94a3b8;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --band: #f8fafc;
        --band-border: #e2e8f0;
        --entry-fill: #fff6e6;
        --entry-stroke: #d98a13;
        --action-fill: #fff0ea;
        --action-stroke: #f2643b;
        --host-fill: #f1f5f9;
        --host-stroke: #475569;
        --verify-fill: #e7faf6;
        --verify-stroke: #0e8077;
        --pause-fill: #f3efff;
        --pause-stroke: #7c5ce0;
        --stop-fill: #fff0f4;
        --stop-stroke: #c81e63;
        --term-fill: #0f172a;
        --term-text: #ffffff;
        --label-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf3;
          --muted: #8b949e;
          --line: #64748b;
          --card: #161b22;
          --card-border: #30363d;
          --band: #0d1117;
          --band-border: #30363d;
          --entry-fill: #3a2606;
          --entry-stroke: #fbbf24;
          --action-fill: #3a1a10;
          --action-stroke: #ff8a5c;
          --host-fill: #1e293b;
          --host-stroke: #94a3b8;
          --verify-fill: #04302b;
          --verify-stroke: #4fd6c6;
          --pause-fill: #241b42;
          --pause-stroke: #a78bfa;
          --stop-fill: #330a1b;
          --stop-stroke: #ff5e9a;
          --term-fill: #e6edf3;
          --term-text: #0d1117;
          --label-bg: #0d1117;
        }
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title-big { fill: var(--text); font-size: 19px; font-weight: 700; }
      .title { fill: var(--text); font-size: 14px; font-weight: 650; }
      .sub { fill: var(--muted); font-size: 11px; }
      .tiny { fill: var(--muted); font-size: 9.5px; }
      .tag { fill: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; }
      .tag-warn { fill: var(--stop-stroke); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; }
      .mono { fill: var(--text); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      .mono-tiny { fill: var(--muted); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 9.5px; }
      .state { fill: var(--text); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; font-weight: 700; }
      .band { fill: var(--band); stroke: var(--band-border); stroke-width: 1.5; }
      .card { fill: var(--card); stroke: var(--card-border); stroke-width: 1.6; }
      .entry { fill: var(--entry-fill); stroke: var(--entry-stroke); stroke-width: 1.8; }
      .manifest { fill: var(--pause-fill); stroke: var(--pause-stroke); stroke-width: 2; }
      .ok { fill: var(--verify-fill); stroke: var(--verify-stroke); stroke-width: 2; }
      .host { fill: var(--host-fill); stroke: var(--host-stroke); stroke-width: 1.8; }
      .warn { fill: var(--stop-fill); stroke: var(--stop-stroke); stroke-width: 1.8; }
      .flow { fill: none; stroke: var(--line); stroke-width: 2; }
      .flow-main { fill: none; stroke: var(--verify-stroke); stroke-width: 2.2; }
      .flow-stop { fill: none; stroke: var(--stop-stroke); stroke-width: 1.9; }
      .flow-weak { fill: none; stroke: var(--pause-stroke); stroke-width: 1.7; stroke-dasharray: 6 4; }
      .edge-label { fill: var(--muted); font-size: 9px; font-style: italic; }
      .label-bg { fill: var(--label-bg); opacity: 0.98; }
      .flow,
      .flow-main,
      .flow-stop,
      .flow-weak {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
    <marker id="io-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="io-arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--verify-stroke)"/>
    </marker>
    <marker id="io-arrow-stop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--stop-stroke)"/>
    </marker>
    <marker id="io-arrow-weak" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pause-stroke)"/>
    </marker>
  </defs>

  <text class="title-big" x="40" y="36">Slipway · adapter install and ownership safety</text>
  <text class="sub" x="40" y="58">the manifest is the only authority · ordinary edits and stale claims are preserved · only pristine files are mutated</text>

  <!-- first install -->
  <rect class="band" x="40" y="88" width="440" height="230" rx="16"/>
  <text class="tag" x="60" y="112">FIRST INSTALL</text>

  <rect class="entry" x="60" y="126" width="400" height="42" rx="11"/>
  <text class="mono" x="78" y="152">slipway install --tool ID [--surface ide|cli]</text>

  <line class="flow" x1="260" y1="168" x2="260" y2="184" marker-end="url(#io-arrow)"/>

  <rect class="host" x="60" y="184" width="400" height="52" rx="11"/>
  <text class="title" x="78" y="206">Write host-local capability files only</text>
  <text class="tiny" x="78" y="224">no global host settings · no ambient hooks · no launcher · no router</text>

  <line class="flow-main" x1="260" y1="236" x2="260" y2="252" marker-end="url(#io-arrow-main)"/>

  <rect class="manifest" x="60" y="252" width="400" height="52" rx="11"/>
  <text class="title" x="78" y="274">Record the ownership manifest</text>
  <text class="tiny" x="78" y="292">repository-relative paths + SHA-256 per file · claims only what it created</text>

  <!-- the sentinel is a health signal, never an ownership claim -->
  <rect class="card" x="520" y="88" width="280" height="88" rx="12"/>
  <text class="title" x="540" y="114">Generated sentinel</text>
  <text class="tiny" x="540" y="133">reports installation HEALTH</text>
  <text class="tag-warn" x="540" y="153">NOT OWNERSHIP AUTHORITY</text>
  <text class="tiny" x="540" y="168">a modified sentinel is preserved, not adopted</text>
  <path class="flow-weak" d="M520 132 H500 V278 H460" marker-end="url(#io-arrow-weak)"/>

  <!-- every later operation -->
  <rect class="band" x="520" y="190" width="640" height="218" rx="16"/>
  <text class="tag" x="540" y="214">EVERY LATER OPERATION</text>

  <rect class="entry" x="540" y="228" width="600" height="40" rx="11"/>
  <text class="mono" x="560" y="253">slipway install --tool ID --refresh        ·        slipway uninstall --tool ID</text>

  <line class="flow" x1="840" y1="268" x2="840" y2="284" marker-end="url(#io-arrow)"/>
  <polygon points="840,284 940,320 840,356 740,320" fill="var(--entry-fill)" stroke="var(--entry-stroke)" stroke-width="1.8"/>
  <text class="title" x="840" y="318" text-anchor="middle">manifest version</text>
  <text class="tiny" x="840" y="332" text-anchor="middle">supported?</text>
  <path class="flow-stop" d="M740 320 H675 V360" marker-end="url(#io-arrow-stop)"/>
  <rect class="warn" x="540" y="360" width="270" height="44" rx="9"/>
  <text class="title" x="560" y="380">FAIL FAST · no mutation</text>
  <text class="tiny" x="560" y="396">unsupported version; nothing is written or removed</text>
  <rect class="label-bg" x="710" y="298" width="30" height="18" rx="5"/>
  <text class="edge-label" x="716" y="311">no</text>

  <!-- yes: classify every recorded claim -->
  <path class="flow-main" d="M840 356 V430 H600 V450" marker-end="url(#io-arrow-main)"/>
  <rect class="label-bg" x="850" y="374" width="32" height="18" rx="5"/>
  <text class="edge-label" x="858" y="387">yes</text>

  <rect class="ok" x="250" y="450" width="700" height="60" rx="14"/>
  <text class="title" x="600" y="471" text-anchor="middle">Reclassify every recorded file</text>
  <text class="tiny" x="600" y="491" text-anchor="middle">compare current SHA-256 with the recorded claim and current-version generated bytes</text>

  <!-- four dedicated branch lanes; no shared or near-overlapping segments -->
  <path class="flow-main" d="M400 510 V536 H165 V562" marker-end="url(#io-arrow-main)"/>
  <path class="flow-main" d="M500 510 V536 H450 V562" marker-end="url(#io-arrow-main)"/>
  <path class="flow-stop" d="M700 510 V536 H735 V562" marker-end="url(#io-arrow-stop)"/>
  <path class="flow-stop" d="M800 510 V536 H1028 V562" marker-end="url(#io-arrow-stop)"/>

  <rect class="ok" x="40" y="562" width="250" height="100" rx="13"/>
  <text class="state" x="60" y="589">pristine</text>
  <text class="tiny" x="60" y="610">hash still matches the manifest</text>
  <text class="sub" x="60" y="634">refresh → rewrite it</text>
  <text class="sub" x="60" y="652">uninstall → remove it</text>

  <rect class="host" x="325" y="562" width="250" height="100" rx="13"/>
  <text class="state" x="345" y="589">missing</text>
  <text class="tiny" x="345" y="610">recorded, but gone from disk</text>
  <text class="sub" x="345" y="634">refresh → recreate pristine</text>
  <text class="sub" x="345" y="652">uninstall → nothing to remove</text>

  <rect class="warn" x="610" y="562" width="250" height="100" rx="13"/>
  <text class="state" x="630" y="589">ordinary modified</text>
  <text class="tiny" x="630" y="610">current bytes are user-edited</text>
  <text class="sub" x="630" y="634">PRESERVED and reported</text>
  <text class="sub" x="630" y="652">never overwritten or removed</text>

  <rect class="warn" x="895" y="562" width="265" height="100" rx="13"/>
  <text class="state" x="915" y="589">stale generated claim</text>
  <text class="tiny" x="915" y="610">recorded hash ≠ current-version bytes</text>
  <text class="sub" x="915" y="634">PRESERVED · claim withdrawn</text>
  <text class="sub" x="915" y="652">manual removal before regeneration</text>

  <!-- non-adoption and storage invariants -->
  <rect class="warn" x="40" y="682" width="725" height="72" rx="13"/>
  <text class="tag-warn" x="60" y="706">NEVER SILENTLY ADOPTED AS MANAGED CONTENT</text>
  <text class="sub" x="60" y="728">unknown file · modified sentinel · malformed manifest · path escape · duplicate claim · unsafe symlink</text>
  <text class="tiny" x="60" y="746">each is preserved or rejected with a reported reason · stale claims are withdrawn separately from ordinary user edits</text>

  <rect class="ok" x="830" y="682" width="330" height="72" rx="13"/>
  <text class="title" x="850" y="706">Run data is never touched</text>
  <text class="tiny" x="850" y="725">uninstall removes only pristine adapter</text>
  <text class="tiny" x="850" y="742">files; journals under the Git common dir stay</text>

  <rect class="band" x="40" y="772" width="1120" height="42" rx="12"/>
  <text class="sub" x="60" y="798">Ten host targets: claude · codex · copilot · cursor · kilo · kiro · opencode · pi · qwen · windsurf — Kiro records `--surface ide|cli` on first install, and an ordinary refresh cannot switch it.</text>
</svg>
