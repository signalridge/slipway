<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" role="img" aria-labelledby="lifecycle-title lifecycle-desc">
  <title id="lifecycle-title">Slipway Run lifecycle</title>
  <desc id="lifecycle-desc">A Run begins only after explicit user invocation. The CLI issues one Action, the host performs work and returns a structured Outcome, and the CLI strictly validates, observes Git independently, derives the next operation, records the transition, and then chooses another Action, pausing, stopping, or ending. A paused Run exposes its current typed next operation: answerable decision and destructive pauses use answer, confirm, or skip, while budget, environment, or source-candidate recovery may expose a resume variant. Answer, confirm, or skip can produce Active or leave the Run Paused on budget exhaustion; source refresh can create a paused source candidate awaiting an explicit choice; stop can move a paused Run to Stopped. Only stop or the current typed next resume variant authorizes resume, which can produce Active or Paused. Ended means only that the automatic Action queue is empty, not that the work is correct, merged, deployed, or ready to release.</desc>
  <metadata id="mermaid-source"><![CDATA[
flowchart LR
  User([Explicit user start]) --> Run[Create Run or authorized resume]
  Run --> Action[CLI issues one Action\norient · clarify · implement · review · summarize]
  Action --> Host[Host performs work\nand returns structured Outcome]
  Host --> Validate[CLI validates + observes Git\nthen records the transition]
  Validate --> Next{Current typed next}
  Next -->|next.operation = action| Action
  Action -->|skip · no reason required| Validate
  Next -->|next.operation = answer: decision or destructive pause| Paused([Paused])
  Next -->|next.operation = resume: budget, environment, or source candidate| Paused
  Paused -->|current typed answer / confirm / skip| Result{derive resulting typed state}
  Result -->|Active · next Action| Action
  Result -->|Paused · budget exhausted| Paused
  Paused -->|stop| Stopped([Stopped])
  Paused -->|only current typed next.operation = resume| Revalidate[revalidate identity · void stale work]
  Next -->|stop / reorder / take over| Stopped
  Stopped -->|only current typed resume variant| Revalidate
  Revalidate -->|Active · next Action| Action
  Revalidate -->|Paused · source refresh candidate| Paused
  Paused -->|explicit typed source choice → fresh Action| Action
  Next -->|automatic queue empty| Ended([Ended])
  Ended -.-> Note[Not a certificate for tests, findings, merge, deploy, or release]
]]></metadata>
  <defs>
    <style>
      :root {
        --text: #0f172a;
        --muted: #64748b;
        --line: #94a3b8;
        --card: #ffffff;
        --card-border: #e2e8f0;
        --band: #f8fafc;
        --band-border: #e2e8f0;
        --entry-fill: #fff6e6;
        --entry-stroke: #d98a13;
        --action-fill: #fff0ea;
        --action-stroke: #f2643b;
        --host-fill: #f1f5f9;
        --host-stroke: #475569;
        --verify-fill: #e7faf6;
        --verify-stroke: #0e8077;
        --pause-fill: #f3efff;
        --pause-stroke: #7c5ce0;
        --stop-fill: #fff0f4;
        --stop-stroke: #c81e63;
        --term-fill: #0f172a;
        --term-text: #ffffff;
        --label-bg: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --text: #e6edf3;
          --muted: #8b949e;
          --line: #64748b;
          --card: #161b22;
          --card-border: #30363d;
          --band: #0d1117;
          --band-border: #30363d;
          --entry-fill: #3a2606;
          --entry-stroke: #fbbf24;
          --action-fill: #3a1a10;
          --action-stroke: #ff8a5c;
          --host-fill: #1e293b;
          --host-stroke: #94a3b8;
          --verify-fill: #04302b;
          --verify-stroke: #4fd6c6;
          --pause-fill: #241b42;
          --pause-stroke: #a78bfa;
          --stop-fill: #330a1b;
          --stop-stroke: #ff5e9a;
          --term-fill: #e6edf3;
          --term-text: #0d1117;
          --label-bg: #0d1117;
        }
      }
      text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
      .title-big { fill: var(--text); font-size: 19px; font-weight: 700; }
      .title { fill: var(--text); font-size: 14px; font-weight: 650; }
      .sub { fill: var(--muted); font-size: 11px; }
      .tiny { fill: var(--muted); font-size: 9.5px; }
      .tag { fill: var(--muted); font-size: 9.5px; font-weight: 700; letter-spacing: 1.4px; }
      .mono { fill: var(--text); font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 600; }
      .band { fill: var(--band); stroke: var(--band-border); stroke-width: 1.5; }
      .card { fill: var(--card); stroke: var(--card-border); stroke-width: 1.6; }
      .entry { fill: var(--entry-fill); stroke: var(--entry-stroke); stroke-width: 1.8; }
      .action { fill: var(--action-fill); stroke: var(--action-stroke); stroke-width: 2; }
      .host { fill: var(--host-fill); stroke: var(--host-stroke); stroke-width: 1.8; }
      .verify { fill: var(--verify-fill); stroke: var(--verify-stroke); stroke-width: 2; }
      .pause { fill: var(--pause-fill); stroke: var(--pause-stroke); stroke-width: 1.8; }
      .stop { fill: var(--stop-fill); stroke: var(--stop-stroke); stroke-width: 1.8; }
      .flow { fill: none; stroke: var(--line); stroke-width: 2; }
      .flow-main { fill: none; stroke: var(--verify-stroke); stroke-width: 2.2; }
      .flow-control { fill: none; stroke: var(--pause-stroke); stroke-width: 1.8; stroke-dasharray: 6 4; }
      .flow-pause { fill: none; stroke: var(--pause-stroke); stroke-width: 1.9; }
      .flow-stop { fill: none; stroke: var(--stop-stroke); stroke-width: 1.9; }
      .edge-label { fill: var(--muted); font-size: 9px; font-style: italic; }
      .label-bg { fill: var(--label-bg); opacity: 0.98; }
      .flow,
      .flow-main,
      .flow-control,
      .flow-pause,
      .flow-stop {
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .term-text { fill: var(--term-text); font-size: 14px; font-weight: 700; }
      .note { fill: var(--band); stroke: var(--band-border); stroke-width: 1.2; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="arrow-main" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--verify-stroke)"/>
    </marker>
    <marker id="arrow-control" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pause-stroke)"/>
    </marker>
    <marker id="arrow-pause" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--pause-stroke)"/>
    </marker>
    <marker id="arrow-stop" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--stop-stroke)"/>
    </marker>
  </defs>

  <text class="title-big" x="40" y="36">Slipway · Run lifecycle</text>
  <text class="sub" x="40" y="58">one Action at a time · interruptible recovery · honest non-certifying completion</text>

  <!-- main action loop -->
  <rect class="band" x="80" y="90" width="1080" height="350" rx="18"/>
  <text class="tag" x="100" y="115">RECOVERABLE ACTION LOOP</text>

  <!-- connectors use dedicated rails; each recovery route stays outside the cards -->
  <line class="flow" x1="75" y1="205" x2="100" y2="205" marker-end="url(#arrow)"/>
  <line class="flow-main" x1="290" y1="205" x2="330" y2="205" marker-end="url(#arrow-main)"/>
  <line class="flow-main" x1="550" y1="205" x2="590" y2="205" marker-end="url(#arrow-main)"/>
  <line class="flow-main" x1="820" y1="205" x2="870" y2="205" marker-end="url(#arrow-main)"/>
  <line class="flow-main" x1="980" y1="265" x2="980" y2="285" marker-end="url(#arrow-main)"/>

  <!-- scheduler branches: action, pause, stop, and terminal each have its own rail -->
  <path class="flow-main" d="M985 285 V105 H440 V135" marker-end="url(#arrow-main)"/>
  <path class="flow-control" d="M440 265 V300 H840 V205 H870" marker-end="url(#arrow-control)"/>
  <path class="flow-pause" d="M985 375 V410 H260 V500" marker-end="url(#arrow-pause)"/>
  <path class="flow-stop" d="M910 330 H800 V430 H625 V500" marker-end="url(#arrow-stop)"/>
  <path class="flow" d="M985 375 H1010 V500" marker-end="url(#arrow)"/>

  <!-- answer/source choice takes the left margin; typed resume uses one shared lower rail -->
  <path class="flow-main" d="M120 555 H15 V120 H350 V135" marker-end="url(#arrow-main)"/>
  <path class="flow-control" d="M400 555 V625 H1170"/>
  <path class="flow-control" d="M750 545 V625 H1170"/>
  <path class="flow-control" d="M1170 625 V120 H500 V135" marker-end="url(#arrow-control)"/>
  <path class="flow-stop" d="M400 545 H500" marker-end="url(#arrow-stop)"/>

  <!-- explicit start -->
  <circle cx="50" cy="205" r="25" fill="var(--entry-fill)" stroke="var(--entry-stroke)" stroke-width="1.8"/>
  <circle cx="50" cy="205" r="7" fill="var(--entry-stroke)"/>
  <text class="sub" x="50" y="250" text-anchor="middle">explicit start</text>

  <!-- action loop cards -->
  <rect class="entry" x="100" y="155" width="190" height="100" rx="14"/>
  <text class="title" x="195" y="188" text-anchor="middle">Create Run</text>
  <text class="title" x="195" y="207" text-anchor="middle">or typed resume only</text>
  <text class="sub" x="195" y="232" text-anchor="middle">worktree-bound · budgeted · explicit</text>

  <rect class="action" x="330" y="135" width="220" height="130" rx="15"/>
  <text class="title" x="440" y="166" text-anchor="middle">CLI issues one Action</text>
  <text class="mono" x="440" y="192" text-anchor="middle">orient · clarify</text>
  <text class="mono" x="440" y="212" text-anchor="middle">implement · review</text>
  <text class="mono" x="440" y="232" text-anchor="middle">summarize</text>
  <text class="tiny" x="440" y="252" text-anchor="middle">review only after observed changes</text>

  <rect class="host" x="590" y="135" width="230" height="130" rx="15"/>
  <text class="title" x="705" y="166" text-anchor="middle">Host work + Outcome</text>
  <text class="sub" x="705" y="192" text-anchor="middle">performs the bounded action</text>
  <text class="sub" x="705" y="211" text-anchor="middle">reports activities, files, findings</text>
  <text class="sub" x="705" y="230" text-anchor="middle">and uncertainty truthfully</text>
  <text class="tiny" x="705" y="252" text-anchor="middle">reported activity is not proof</text>

  <rect class="verify" x="870" y="135" width="220" height="130" rx="15"/>
  <text class="title" x="980" y="166" text-anchor="middle">Validate · observe · record</text>
  <text class="sub" x="980" y="192" text-anchor="middle">strict Outcome validation</text>
  <text class="sub" x="980" y="211" text-anchor="middle">independent Git observation</text>
  <text class="sub" x="980" y="230" text-anchor="middle">derive the next operation</text>
  <text class="tiny" x="980" y="252" text-anchor="middle">build/append event · replace projection</text>

  <!-- scheduler decision -->
  <polygon points="985,285 1060,330 985,375 910,330" fill="var(--entry-fill)" stroke="var(--entry-stroke)" stroke-width="1.8"/>
  <text class="title" x="985" y="326" text-anchor="middle">What next?</text>
  <text class="tiny" x="985" y="345" text-anchor="middle">scheduler + user control</text>

  <!-- recovery states -->
  <rect class="pause" x="120" y="500" width="280" height="110" rx="22"/>
  <text class="title" x="260" y="532" text-anchor="middle">Paused</text>
  <text class="sub" x="260" y="552" text-anchor="middle">decision / source choice</text>
  <text class="sub" x="260" y="570" text-anchor="middle">environment · budget · destructive scope</text>
  <text class="tiny" x="260" y="590" text-anchor="middle">answer / confirm / skip may remain Paused</text>
  <text class="tiny" x="260" y="606" text-anchor="middle">source refresh → candidate choice → fresh Action</text>

  <rect class="stop" x="500" y="500" width="250" height="90" rx="22"/>
  <text class="title" x="625" y="532" text-anchor="middle">Stopped</text>
  <text class="sub" x="625" y="552" text-anchor="middle">stop · reorder · take over</text>
  <text class="sub" x="625" y="570" text-anchor="middle">journal remains resumable</text>

  <rect x="870" y="500" width="250" height="90" rx="22" fill="var(--term-fill)" stroke="var(--term-fill)" stroke-width="1.8"/>
  <text class="term-text" x="995" y="532" text-anchor="middle">Ended</text>
  <text x="995" y="552" fill="var(--term-text)" opacity="0.78" font-size="11" text-anchor="middle">automatic Action queue empty</text>
  <text x="995" y="570" fill="var(--term-text)" opacity="0.78" font-size="10" text-anchor="middle">terminal for this Run</text>

  <!-- labels sit beside rails, never on top of a connector -->
  <rect class="label-bg" x="620" y="70" width="100" height="18" rx="5"/>
  <text class="edge-label" x="626" y="83">next Action</text>

  <rect class="label-bg" x="565" y="278" width="170" height="18" rx="5"/>
  <text class="edge-label" x="571" y="291">skip · no reason required</text>

  <rect class="label-bg" x="500" y="388" width="230" height="18" rx="5"/>
  <text class="edge-label" x="506" y="401">answer / resume → Paused</text>

  <rect class="label-bg" x="635" y="438" width="210" height="18" rx="5"/>
  <text class="edge-label" x="641" y="451">stop / reorder / take over</text>

  <rect class="label-bg" x="1025" y="438" width="180" height="18" rx="5"/>
  <text class="edge-label" x="1031" y="451">automatic queue empty</text>

  <rect class="label-bg" x="405" y="517" width="160" height="18" rx="5"/>
  <text class="edge-label" x="411" y="530">stop from Paused</text>

  <rect class="label-bg" x="20" y="334" width="230" height="18" rx="5"/>
  <text class="edge-label" x="26" y="347">answer / source choice → Action</text>

  <rect class="label-bg" x="700" y="600" width="270" height="18" rx="5"/>
  <text class="edge-label" x="706" y="613">resume variant → revalidate → Action</text>

  <rect class="note" x="40" y="650" width="1120" height="72" rx="12"/>
  <text class="sub" x="60" y="670">Transitions follow typed `next`: answer/confirm/skip may yield Active or remain Paused on budget exhaustion; source refresh may create a paused candidate.</text>
  <text class="sub" x="60" y="690">Only stop or current `next.operation = resume` authorizes resume; every resume revalidates identity and voids stale work.</text>
  <text class="sub" x="60" y="710">Ended is not a certificate for tests, correctness, clean review, branch policy, merge, deployment, or release readiness.</text>
</svg>
